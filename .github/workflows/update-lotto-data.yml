name: Update Lotto Data

on:
  # 매주 토요일 22:00 KST (13:00 UTC) - 추첨(20:45) 후 충분한 여유
  schedule:
    - cron: '0 13 * * 6'

  # 수동 실행 가능
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        run: node scripts/update-lotto-data.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Auto-update: Add latest lotto results"
          branch: auto-update/lotto-data
          delete-branch: true
          title: "Auto-update: 최신 로또 당첨번호 추가"
          body: |
            동행복권 공식 API에서 최신 회차를 자동으로 가져왔습니다.

            - 워크플로우: `Update Lotto Data`
            - 실행 시각 (UTC): `${{ github.event.repository.updated_at }}`

            확인 후 머지해주세요.
          add-paths: |
            LottoAnalyzer.Core/Services/LottoDataService.cs
            LottoApp/src/services/lotteryService.ts
